<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography — David Rose</title>
<meta name="description" content="Landscapes and quiet places. Limited and open-edition prints, plus printed photobooks. Ships worldwide from the EU.">
<meta property="og:title" content="Photography — David Rose">
<meta property="og:description" content="Landscapes and quiet places. Prints and photobooks ship worldwide from the EU.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#dbdbda">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-world="photography">

<a class="skip" href="#main">Skip to content</a>
<div class="veil" data-veil aria-hidden="true"></div>
<div class="crosses" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<p class="nojs">This site uses JavaScript for the shop and galleries. Everything is still readable without it.</p>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" data-brand>David Rose</a>
    <nav class="worlds" aria-label="Sections" data-nav></nav>
  </div>
</header>

<main id="main">

  <!-- HERO -->
  <section class="hero">
    <div class="shell">
      <p class="hero-kicker label" data-copy-html="photography.01-photography.kicker"></p>

      <div class="hero-grid">
        <h1 class="display" data-copy-html="photography.01-photography.h1"></h1>

        <p class="lede" data-copy-html="photography.01-photography.lede"></p>

        <div class="hero-meta" data-copy-html="photography.01-photography.meta"></div>
      </div>
    </div>
  </section>

  <!-- GALLERY — four ways to browse -->
  <section class="showcase" data-gallery-section style="--field: var(--blue)">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-gallery-kicker>Browse — 01</p>
          <h2 class="h2" data-gallery-title>Landscape</h2>
        </div>
        <p class="aside" data-gallery-aside>Field and weather</p>
      </div>

      <nav class="tabs" data-gallery-tabs aria-label="Browse photography"></nav>

      <div class="masonry" data-gallery></div>
      <p class="field-big" data-gallery-count>8 photographs</p>
    </div>
  </section>

  <!-- HOW PRINTS WORK -->
  <section class="section" id="prints">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.prints.label"></p>
          <h2 class="h2" data-copy-html="photography.prints.heading"></h2>
        </div>
        <p class="aside" data-copy-html="photography.prints.aside"></p>
      </div>
      <div class="hero-stats" style="margin-top:clamp(20px,2.6vw,36px)" data-copy-html="photography.prints.stats"></div>
    </div>
  </section>

  <!-- PHOTOBOOKS -->
  <section class="section" id="photobooks">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.photobooks.label"></p>
          <h2 class="h2" data-copy-html="photography.photobooks.heading"></h2>
        </div>
        <p class="aside" data-copy-html="photography.photobooks.aside"></p>
      </div>
      <div class="grid-books" data-photobooks></div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section" id="faq">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.faq.label"></p>
          <h2 class="h2" data-copy-html="photography.faq.heading"></h2>
        </div>
        <p class="aside" data-copy-html="photography.faq.aside"></p>
      </div>
      <div data-faq></div>
    </div>
  </section>

</main>

<footer class="foot" data-copy-html="photography.footer">
  </footer>

<!-- PHOTOGRAPH LIGHTBOX -->
<dialog class="lightbox" data-lightbox aria-label="Photograph">
  <button class="lightbox-close" type="button" aria-label="Close">✕</button>
  <img data-lightbox-img alt="">
  <p class="lightbox-cap" data-lightbox-cap></p>
</dialog>

<!-- PRINT DETAIL PANEL -->
<dialog class="panel" data-panel aria-label="Print details">
  <div class="panel-head" data-panel-head>
    <span class="label">Print details</span>
    <button class="panel-close" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  </div>
  <div class="panel-body" data-panel-body></div>
</dialog>

<script src="content/media.js"></script>
<script src="content/copy.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
