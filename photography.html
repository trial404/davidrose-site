<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography — David Rose</title>
<meta name="description" content="Landscapes and quiet places. Limited and open-edition prints, plus printed photobooks. Ships worldwide from the EU.">
<meta property="og:title" content="Photography — David Rose">
<meta property="og:description" content="Landscapes and quiet places. Prints and photobooks ship worldwide from the EU.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#dbdbda">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-world="photography">

<a class="skip" href="#main">Skip to content</a>
<div class="veil" data-veil aria-hidden="true"></div>
<div class="crosses" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<p class="nojs">This site uses JavaScript for the shop and galleries. Everything is still readable without it.</p>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" data-brand>David Rose</a>
    <nav class="worlds" aria-label="Sections" data-nav></nav>
  </div>
</header>

<main id="main">

  <!-- HERO -->
  <section class="hero">
    <div class="shell">
      <p class="hero-kicker label" data-copy-html="photography.01-photography.kicker">

      <div class="hero-grid">
        <h1 class="display" data-copy-html="photography.01-photography.h1">

        <p class="lede" data-copy-html="photography.01-photography.lede">

        <div class="hero-meta" data-copy-html="photography.01-photography.meta">
      </div>
    </div>
  </section>

  <!-- SERIES 01 — LANDSCAPE -->
  <section class="showcase" id="landscape" style="--field: var(--blue)">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.landscape.label">
          <h2 class="h2" data-copy-html="photography.landscape.heading">
        </div>
        <p class="aside" data-copy-html="photography.landscape.aside">
      </div>
      <div class="masonry" data-photos data-only="Landscape"></div>
      <p class="field-big" data-count>8 photographs</p>
    </div>
  </section>

  <!-- SERIES 02 — ARTISTIC -->
  <section class="showcase" id="artistic" style="--field: var(--orange)">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.artistic.label">
          <h2 class="h2" data-copy-html="photography.artistic.heading">
        </div>
        <p class="aside" data-copy-html="photography.artistic.aside">
      </div>
      <div class="masonry" data-photos data-only="Artistic"></div>
      <p class="field-big" data-count>19 photographs</p>
    </div>
  </section>

  <!-- PRINTS -->
  <section class="section" id="prints">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.prints.label">
          <h2 class="h2" data-copy-html="photography.prints.heading">
        </div>
        <p class="aside" data-copy-html="photography.prints.aside">
      </div>

      <div class="grid-prints" data-prints></div>

      <div class="hero-stats" style="margin-top:clamp(20px,2.6vw,36px)" data-copy-html="photography.prints.stats">
    </div>
  </section>

  <!-- PHOTOBOOKS -->
  <section class="section" id="photobooks">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.photobooks.label">
          <h2 class="h2" data-copy-html="photography.photobooks.heading">
        </div>
        <p class="aside" data-copy-html="photography.photobooks.aside">
      </div>
      <div class="grid-books" data-photobooks></div>
    </div>
  </section>

  <!-- FAQ -->
  <section class="section" id="faq">
    <div class="shell">
      <div class="section-head">
        <div>
          <p class="label muted" data-copy-html="photography.faq.label">
          <h2 class="h2" data-copy-html="photography.faq.heading">
        </div>
        <p class="aside" data-copy-html="photography.faq.aside">
      </div>
      <div data-faq></div>
    </div>
  </section>

</main>

<footer class="foot" data-copy-html="photography.footer">
  </footer>

<!-- PRINT DETAIL PANEL -->
<dialog class="panel" data-panel aria-label="Print details">
  <div class="panel-head" data-panel-head>
    <span class="label">Print details</span>
    <button class="panel-close" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  </div>
  <div class="panel-body" data-panel-body></div>
</dialog>

<script src="content/media.js"></script>
<script src="content/copy.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
